<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BookHolic: find your next favourite story</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9D9B5; --page:#F3E7C9; --card:#FBF3DC; --ink:#3A2A1C; --muted:#7b6548;
  --red:#8C2F2B; --wax:#F6EBCB; --wax2:#E6D5A5; --gold:#A97C2A; --wood:#4a3020; --line:#b9a36f; --shadow:rgba(58,42,28,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17110c; --page:#251b13; --card:#30241a; --ink:#EBDDBB; --muted:#a8946f; --red:#d0716a; --wax:#E8D9B2; --wax2:#D2BE8A; --gold:#D8B060; --wood:#3a2616; --line:#5b4630; --shadow:rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#17110c; --page:#251b13; --card:#30241a; --ink:#EBDDBB; --muted:#a8946f; --red:#d0716a; --wax:#E8D9B2; --wax2:#D2BE8A; --gold:#D8B060; --wood:#3a2616; --line:#5b4630; --shadow:rgba(0,0,0,.6);}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IM Fell English',Georgia,serif;font-size:19px;line-height:1.65;
  padding:clamp(8px,2vw,28px);transition:background-color .6s,color .6s}
.book-page{max-width:1040px;margin:0 auto;background:var(--page);border:1px solid var(--line);outline:3px double var(--line);outline-offset:-12px;
  padding:clamp(28px,5vw,60px) clamp(22px,5vw,64px);position:relative;
  background-image:radial-gradient(ellipse at center,transparent 55%,rgba(120,85,40,.28) 100%),repeating-linear-gradient(0deg,rgba(120,85,40,.035) 0 1px,transparent 1px 4px);
  box-shadow:0 20px 50px -20px var(--shadow)}
h1,h2,h3{font-weight:400;margin:0;line-height:1.15}
.top{display:flex;justify-content:space-between;align-items:center;font-family:'IM Fell English SC',serif;letter-spacing:2px;font-size:.95rem;color:var(--muted)}
button,select{font:inherit;color:inherit}
.theme{background:none;border:1px solid var(--line);padding:3px 14px;cursor:pointer;font-family:'IM Fell English SC',serif;letter-spacing:1px}
.theme:hover{background:var(--card)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.hero{text-align:center;padding:36px 0 10px}
.fleuron{color:var(--gold);font-size:1.8rem;letter-spacing:10px}
.title{font-family:'IM Fell English SC',serif;font-size:clamp(2.8rem,9vw,5.4rem);letter-spacing:4px;color:var(--red)}
.sub{font-style:italic;font-size:1.3rem;margin-top:6px}
.est{font-family:'IM Fell English SC',serif;letter-spacing:3px;color:var(--muted);font-size:.9rem;margin-top:10px}
.intro{max-width:46ch;margin:22px auto 0;text-align:justify;hyphens:auto}
.intro::first-letter{float:left;font-size:3.6rem;line-height:.8;padding:6px 8px 0 0;color:var(--red);font-family:'IM Fell English SC',serif}
.rule{display:flex;align-items:center;gap:14px;color:var(--gold);margin:34px 0}
.rule::before,.rule::after{content:"";flex:1;border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:4px}
/* library checkout card */
.picker{max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line);padding:26px 28px 24px;transform:rotate(-.6deg);
  box-shadow:3px 5px 0 var(--shadow);font-family:'Special Elite','Courier New',monospace;font-size:.95rem;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(80,110,160,.25) 31px 32px)}
.picker h2{font-size:1.15rem;letter-spacing:3px;text-align:center;border-bottom:2px solid var(--red);padding-bottom:8px;margin-bottom:16px;color:var(--red)}
.picker label{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px;font-size:.8rem;color:var(--muted)}
select{background:transparent;border:0;border-bottom:1px dashed var(--ink);padding:6px 2px;width:100%;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--ink)}
select option{background:var(--card);color:var(--ink)}
.go{display:block;margin:18px auto 0;background:var(--red);color:#fbf3dc;border:2px solid var(--red);padding:9px 28px;cursor:pointer;
  font-family:'IM Fell English SC',serif;font-size:1.1rem;letter-spacing:3px;transition:background .3s,color .3s}
.go:hover{background:transparent;color:var(--red)}
.go:disabled{opacity:.6;cursor:wait}
.status{text-align:center;margin-top:18px;font-style:italic;color:var(--muted);min-height:1.65em}
.status.err{color:var(--red)}
.chapter{text-align:center;margin-top:10px}
.chapter small{font-family:'IM Fell English SC',serif;letter-spacing:4px;color:var(--muted);font-size:.9rem}
.chapter h2{font-size:2.1rem;font-style:italic}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:26px 20px;padding:30px 14px 0;margin-top:18px;
  background:linear-gradient(var(--bg),var(--bg));background-color:rgba(74,48,32,.12);border-bottom:16px solid var(--wood);box-shadow:0 14px 16px -12px var(--shadow)}
.book{display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:20px}
.cover{width:128px;height:190px;overflow:hidden;border-radius:2px 5px 5px 2px;box-shadow:-3px 4px 10px var(--shadow),inset 6px 0 6px -3px rgba(0,0,0,.35);
  background:linear-gradient(135deg,#7a2a26,#4a1a18);border-left:5px solid #3a1210;display:flex;align-items:center;justify-content:center;padding:12px;
  font-family:'IM Fell English SC',serif;font-size:1.05rem;color:#E3C27A;line-height:1.25;letter-spacing:1px;transition:transform .4s}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.book:hover .cover{transform:translateY(-8px) rotate(-1.5deg)}
.book h3{font-size:1.2rem;margin-top:14px;font-style:italic}
.author{font-size:.9rem;color:var(--muted)}
.meta{font-size:.85rem;margin:2px 0 8px;color:var(--gold);letter-spacing:1px}
.links{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.links a{font-family:'IM Fell English SC',serif;font-size:.8rem;letter-spacing:1px;text-decoration:none;color:var(--red);border:1px solid var(--red);padding:1px 10px;transition:background .3s,color .3s}
.links a:hover{background:var(--red);color:#fbf3dc}
footer{text-align:center;margin-top:40px;color:var(--muted);font-style:italic}
/* decorations */
.wax{fill:var(--wax)} .wax2{fill:var(--wax2)}
.deco{display:block;overflow:visible}
.scene{display:flex;justify-content:center;align-items:flex-end;gap:clamp(12px,3vw,44px)}
.scene .center{text-align:center;flex:0 1 auto}
.scene .side{display:flex;align-items:flex-end;gap:6px}
.scene .stackbig{width:130px;height:145px}
.c1{width:44px;height:122px}.c2{width:36px;height:100px}.c3{width:30px;height:84px}
.ic{width:34px;height:48px;flex:none}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.7s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) rotate(-1deg)}30%{transform:scale(.93,1.07) rotate(1.2deg)}60%{transform:scale(1.04,.95) rotate(-.6deg)}100%{transform:scale(.97,1.04) rotate(1deg)}}
.steam{animation:steam 3.4s ease-in-out infinite}.steam.s2{animation-delay:1.4s}
@keyframes steam{0%{opacity:0;transform:translateY(5px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-7px)}}
.glow{animation:pulse 3.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:.95}}
.lrow{display:flex;align-items:flex-end;gap:14px}
.lrow .deco{width:60px;height:96px}.lrow .deco.m{width:100px;height:112px}
@media (max-width:760px){.scene .deco{display:none}}
@media (prefers-reduced-motion:reduce){.flame,.glow,.steam{animation:none}}
.picker input{background:transparent;border:0;border-bottom:1px dashed var(--ink);padding:6px 2px;width:100%;font:inherit;font-size:1rem;color:var(--ink);text-transform:none;letter-spacing:0;border-radius:0}
.picker input::placeholder{color:var(--muted);opacity:.7}
.stag{font-family:'IM Fell English SC',serif;font-size:.78rem;letter-spacing:1px;color:var(--red);margin-top:12px;border-top:1px solid var(--line);padding-top:2px}
/* loading quotes */
.loader{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
  background:var(--page);background-image:radial-gradient(ellipse at center,transparent 50%,rgba(120,85,40,.3) 100%);opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
.loader.on{opacity:1;visibility:visible}
.lq{max-width:30ch;font-size:clamp(1.4rem,4vw,2.1rem);font-style:italic;line-height:1.4;margin:22px 0 14px;transition:opacity .6s}
.la{font-family:'IM Fell English SC',serif;letter-spacing:2px;color:var(--muted);transition:opacity .6s}
.lq.out,.la.out{opacity:0}
.lw{margin-top:34px;font-family:'Special Elite',monospace;font-size:.85rem;letter-spacing:2px;color:var(--red)}
/* aesthetic polish */
:root{--halo:rgba(255,196,110,.5);--tglow:rgba(201,140,40,.28)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--halo:rgba(255,160,60,.2);--tglow:rgba(255,170,70,.4)}}
:root[data-theme="dark"]{--halo:rgba(255,160,60,.2);--tglow:rgba(255,170,70,.4)}
html{scrollbar-color:var(--wood) var(--bg)}
::selection{background:var(--red);color:#fbf3dc}
body{background:radial-gradient(ellipse 85% 65% at 50% 0%,var(--halo),transparent 72%) fixed,var(--bg)}
.book-page{box-shadow:0 1px 0 var(--line),0 4px 0 -1px var(--page),0 5px 0 -1px var(--line),0 8px 0 -2px var(--page),0 9px 0 -2px var(--line),0 40px 70px -25px var(--shadow)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero{animation:rise 1.2s ease both}
.title{text-shadow:0 1px 0 rgba(255,238,190,.55),0 0 26px var(--tglow)}
.sub{display:flex;align-items:center;justify-content:center;gap:14px}
.sub::before,.sub::after{content:"";width:clamp(22px,8vw,72px);border-top:1px solid var(--gold)}
.picker{position:relative}
.picker::before{content:"";position:absolute;top:-8px;right:36px;width:26px;height:68px;background:linear-gradient(90deg,#9c3430,#6e2220);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.shelf{border-bottom:0;background:linear-gradient(to top,rgba(255,190,100,.16),transparent 45%),rgba(74,48,32,.1);box-shadow:none}
.shelf::after{content:"";grid-column:1/-1;height:18px;margin:-22px -14px 0;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 2px,transparent 2px 11px),linear-gradient(#6b4a30,#3d2616);
  box-shadow:inset 0 2px 0 rgba(255,220,160,.28),0 14px 18px -8px var(--shadow)}
.book{animation:rise .8s ease both;animation-delay:calc(var(--i,0)*90ms)}
.cover{position:relative}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 35%,transparent 70%,rgba(0,0,0,.22))}
.loader{box-shadow:inset 0 0 0 10px var(--page),inset 0 0 0 11px var(--line)}
.motes{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.mote{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:#FFD27A;opacity:0;animation:drift var(--d) linear var(--dl) infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}12%{opacity:.6}85%{opacity:.35}100%{transform:translate(var(--x),-105vh);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (prefers-reduced-motion:reduce){.hero,.book{animation:none}.motes{display:none}}
</style>
</head>

<script>
// Change this if your FastAPI runs somewhere else
const API_URL = "http://127.0.0.1:8000/recommend";
// Amazon store for the Buy button (use "www.amazon.com" for the US store)
const AMAZON = "www.amazon.in";
 
// Shown only when the API can't be reached, so you can preview the design
const DEMO = [
  {"Book-Title":"Pride and Prejudice","Book-Author":"Jane Austen","avg_rating":8.6},
  {"Book-Title":"The Notebook","Book-Author":"Nicholas Sparks","avg_rating":8.1},
  {"Book-Title":"Outlander","Book-Author":"Diana Gabaldon","avg_rating":8.4},
  {"Book-Title":"Jane Eyre","Book-Author":"Charlotte Brontë","avg_rating":8.5},
  {"Book-Title":"Persuasion","Book-Author":"Jane Austen","avg_rating":8.3}
];
 
const $ = id => document.getElementById(id);
const q = s => encodeURIComponent(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 
const QUOTES = [
  ["You must allow me to tell you how ardently I admire and love you.","Jane Austen, Pride and Prejudice"],
  ["Whatever our souls are made of, his and mine are the same.","Emily Brontë, Wuthering Heights"],
  ["You pierce my soul. I am half agony, half hope.","Jane Austen, Persuasion"],
  ["If I loved you less, I might be able to talk about it more.","Jane Austen, Emma"],
  ["I was in the middle before I knew that I had begun.","Jane Austen, Pride and Prejudice"],
  ["I loved her against reason, against promise, against peace, against hope, against happiness.","Charles Dickens, Great Expectations"],
  ["Reader, I married him.","Charlotte Brontë, Jane Eyre"]
];
let qi = Math.floor(Math.random()*QUOTES.length), qTimer;
function showQuote(){
  const [t,a] = QUOTES[qi % QUOTES.length];
  $("lq").textContent = "\u201C" + t + "\u201D"; $("la").textContent = "\u2014 " + a;
}
function startLoader(){
  showQuote(); $("loader").classList.add("on");
  qTimer = setInterval(()=>{
    $("lq").classList.add("out"); $("la").classList.add("out");
    setTimeout(()=>{ qi++; showQuote(); $("lq").classList.remove("out"); $("la").classList.remove("out"); },600);
  },4500);
}
function stopLoader(){ clearInterval(qTimer); $("loader").classList.remove("on"); }
const wait = ms => new Promise(r => setTimeout(r, ms));
 
(()=>{const box=$("motes");for(let i=0;i<18;i++){const m=document.createElement("span");m.className="mote";
  m.style.cssText=`left:${Math.random()*100}%;--s:${2+Math.random()*3}px;--d:${12+Math.random()*14}s;--dl:${-Math.random()*20}s;--x:${(Math.random()-.5)*120}px`;box.appendChild(m);}})();
function card(b){
  const t = b["Book-Title"], a = b["Book-Author"], term = q(t + " " + a);
  const img = b["Image-URL-M"];
  const cover = img
    ? `<img src="${esc(img)}" alt="Cover of ${esc(t)}" loading="lazy" onerror="this.parentNode.textContent=this.alt.replace('Cover of ','')">`
    : esc(t);
  return `<article class="book">
    <div class="cover">${cover}</div>
    ${b.series ? `<div class="stag">${esc(b.series)}${b.series_order ? " · Book " + b.series_order : " series"}</div>` : ""}
    <h3 style="margin-top:${b.series ? 4 : 14}px">${esc(t)}</h3>
    <div class="author">${esc(a)}</div>
    <div class="meta">${b.avg_rating ? "★ " + Number(b.avg_rating).toFixed(1) + " / 10" : ""}</div>
    <div class="links">
      <a href="https://openlibrary.org/search?q=${term}" target="_blank" rel="noopener">Borrow</a>
      <a href="https://www.google.com/search?tbm=bks&q=${term}" target="_blank" rel="noopener">Read</a>
      <a href="https://${AMAZON}/s?k=${term}&i=stripbooks" target="_blank" rel="noopener">Buy</a>
    </div>
  </article>`;
}
 
function render(list, genre){
  $("shelf").innerHTML = list.map(card).join("");
  $("shelfTitle").textContent = genre + " books for you";
  $("results").hidden = false;
  $("results").scrollIntoView({behavior:"smooth"});
}
 
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const genre = $("genre").value, experience = $("experience").value, latest_book = $("lastread").value.trim();
  const st = $("status"), btn = $("go");
  st.className = "status"; st.textContent = ""; btn.disabled = true; startLoader();
  const minShow = wait(3000);
  try{
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({genre, experience, latest_book, n:10})
    });
    await minShow; stopLoader();
    if(res.status === 404){
      const err = await res.json().catch(()=>({}));
      st.className = "status err";
      st.textContent = err.detail === "Last read book not found"
        ? `We couldn't find "${latest_book}" in our library. Check the spelling or try another novel you've read.`
        : err.detail === "No similar books found for this genre"
          ? `Nothing in ${genre} feels close enough to "${latest_book}". Try another genre or another novel.`
          : (err.detail || "No books found. Try another genre.");
      $("results").hidden = true;
      return;
    }
    if(!res.ok) throw new Error("API error " + res.status);
    const data = await res.json();
    st.textContent = data.series
      ? `Because you read "${data.matched_book}", we start with more from the ${data.series} series, then similar books.`
      : `Because you read "${data.matched_book}", we picked ${data.count} books for you.`;
    render(data.recommendations, genre);
  }catch(err){
    await minShow; stopLoader();
    st.className = "status err";
    st.textContent = "Couldn't reach the API at " + API_URL + ". Start it with: uvicorn main:app --reload. Showing sample books for now.";
    render(DEMO, genre);
  }finally{
    stopLoader(); btn.disabled = false;
  }
});
 
$("theme").addEventListener("click", () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
